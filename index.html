<!-- UNIVERSAL MULTI-DEVICE CLOUD SYNC ENGINE -->
<script>
(function() {
  const DEFAULT_GH_OWNER = "joyprokash976-lab";
  const DEFAULT_GH_REPO = "saraswati-puja-2026";
  const DEFAULT_GH_BRANCH = "main";
  // নিচের লাইনে আপনার টোকেনটি একবার বসিয়ে নিলে আর কোনো ফোনেই টোকেন দিতে হবে না (ঐচ্ছিক)
  const LOCKED_TOKEN = ""; 

  // ১. যেকোনো ফোন বা ডিভাইস থেকে ওয়েবসাইট ওপেন করলেই গিটহাব সার্ভার থেকে লাইভ ডাটা নিয়ে আসবে
  async function fetchLiveServerData() {
    const owner = localStorage.getItem('sny_gh_owner') || DEFAULT_GH_OWNER;
    const repo = localStorage.getItem('sny_gh_repo') || DEFAULT_GH_REPO;
    const branch = localStorage.getItem('sny_gh_branch') || DEFAULT_GH_BRANCH;

    // Raw URL with cache-buster so phones always see instant updates
    const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/site-data.json?t=${Date.now()}`;
    const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/site-data.json?ref=${branch}&t=${Date.now()}`;

    try {
      let res = await fetch(rawUrl, { cache: "no-store" });
      let remoteData = null;

      if (res.ok) {
        remoteData = await res.json();
      } else {
        // Fallback to GitHub API if Raw CDN is cached
        let apiRes = await fetch(apiUrl, { cache: "no-store" });
        if (apiRes.ok) {
          let fileJson = await apiRes.json();
          const binary = atob(fileJson.content.replace(/\s/g, ''));
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          remoteData = JSON.parse(new TextDecoder().decode(bytes));
        }
      }

      if (remoteData && remoteData.orgName) {
        state = remoteData;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        renderAll();
        console.log("✅ Live data synced from GitHub Server!");
      }
    } catch (err) {
      console.warn("Using default/local data until first cloud publish:", err);
    }
  }

  // ২. অ্যাডমিন প্যানেল থেকে কিছু সেভ করলেই সরাসরি গিটহাবে site-data.json ফাইলে আপলোড হয়ে যাবে
  window.pushToCloudDatabase = async function(silent = false) {
    const owner = (document.getElementById('ghOwnerInput')?.value || localStorage.getItem('sny_gh_owner') || DEFAULT_GH_OWNER).trim();
    const repo = (document.getElementById('ghRepoInput')?.value || localStorage.getItem('sny_gh_repo') || DEFAULT_GH_REPO).trim();
    const branch = (document.getElementById('ghBranchInput')?.value || localStorage.getItem('sny_gh_branch') || DEFAULT_GH_BRANCH).trim();
    const token = (document.getElementById('ghTokenInput')?.value || localStorage.getItem('sny_gh_token') || LOCKED_TOKEN).trim();

    if (!token) {
      showToast("⚠️ অন্য ফোনে লাইভ দেখাতে ৭ নং ট্যাবে GitHub Token বসিয়ে সেভ করুন!");
      return false;
    }

    localStorage.setItem('sny_gh_owner', owner);
    localStorage.setItem('sny_gh_repo', repo);
    localStorage.setItem('sny_gh_branch', branch);
    localStorage.setItem('sny_gh_token', token);

    const statusBadge = document.getElementById('cloudSyncBadge');
    if (statusBadge) {
      statusBadge.textContent = "⏳ সার্ভারে লাইভ আপলোড হচ্ছে...";
      statusBadge.className = "text-xs font-bold px-3 py-1 rounded-full bg-amber-100 text-amber-900 border border-amber-400";
    }
    if (!silent) showToast("⏳ সার্ভারে ছবি ও তথ্য লাইভ আপলোড হচ্ছে...");

    try {
      const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/site-data.json`;
      
      // Check existing SHA of site-data.json
      let sha = undefined;
      const getRes = await fetch(`${apiUrl}?ref=${branch}&t=${Date.now()}`, {
        headers: {
          "Authorization": `Bearer ${token}`,
          "Accept": "application/vnd.github+json"
        }
      });
      if (getRes.ok) {
        const fileData = await getRes.json();
        sha = fileData.sha;
      }

      // Encode current state (including compressed Base64 images) to UTF-8 Base64
      const jsonString = JSON.stringify(state);
      const utf8Bytes = new TextEncoder().encode(jsonString);
      let binaryStr = "";
      const chunkSize = 8192;
      for (let i = 0; i < utf8Bytes.length; i += chunkSize) {
        binaryStr += String.fromCharCode.apply(null, utf8Bytes.subarray(i, i + chunkSize));
      }
      const base64Content = btoa(binaryStr);

      const putRes = await fetch(apiUrl, {
        method: "PUT",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Accept": "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: "Live auto-update via Admin CMS (" + new Date().toLocaleString('bn-BD') + ")",
          content: base64Content,
          branch: branch,
          ...(sha ? { sha } : {})
        })
      });

      if (!putRes.ok) {
        const errObj = await putRes.json();
        throw new Error(errObj.message || "GitHub API Error");
      }

      if (statusBadge) {
        statusBadge.textContent = "✅ সকল ডিভাইসে লাইভ সিঙ্ক সম্পন্ন!";
        statusBadge.className = "text-xs font-bold px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300";
      }
      showToast("✅ সফলভাবে লাইভ হয়েছে! এখন যেকোনো ফোন থেকে দেখা যাবে।");
      return true;
    } catch (err) {
      console.error("Live Sync Error:", err);
      if (statusBadge) {
        statusBadge.textContent = "❌ টোকেন বা রিপোজিটরি এরর!";
        statusBadge.className = "text-xs font-bold px-3 py-1 rounded-full bg-red-100 text-red-800 border border-red-300";
      }
      showToast("❌ লাইভ আপলোড ব্যর্থ: " + err.message);
      return false;
    }
  };

  // ৩. ডিফল্ট ইউজারনেম ও রিপোজিটরি অটো-ফিল করা এবং পেজ লোড হলেই সার্ভার থেকে ডাটা আনা
  window.addEventListener('DOMContentLoaded', () => {
    if (!localStorage.getItem('sny_gh_owner')) localStorage.setItem('sny_gh_owner', DEFAULT_GH_OWNER);
    if (!localStorage.getItem('sny_gh_repo')) localStorage.setItem('sny_gh_repo', DEFAULT_GH_REPO);
    if (!localStorage.getItem('sny_gh_branch')) localStorage.setItem('sny_gh_branch', DEFAULT_GH_BRANCH);

    const ownerEl = document.getElementById('ghOwnerInput');
    const repoEl = document.getElementById('ghRepoInput');
    if (ownerEl && !ownerEl.value) ownerEl.value = DEFAULT_GH_OWNER;
    if (repoEl && !repoEl.value) repoEl.value = DEFAULT_GH_REPO;

    // Fetch live data immediately on load
    fetchLiveServerData();
    // Auto-refresh live data every 20 seconds for public visitors
    setInterval(fetchLiveServerData, 20000);
  });
})();
</script>
